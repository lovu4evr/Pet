name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project (root / subfolder / zip)
        id: find
        shell: bash
        run: |
          set -e
          DIR=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            DIR="$PWD"
          else
            S=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -1)
            if [ -n "$S" ]; then
              DIR="$(cd "$(dirname "$S")" && pwd)"
            else
              Z=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1)
              if [ -z "$Z" ]; then echo "No project or zip found in repo"; exit 1; fi
              mkdir -p /tmp/proj
              unzip -q -o "$Z" -d /tmp/proj
              S=$(find /tmp/proj \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
              if [ -z "$S" ]; then echo "settings.gradle not found inside zip"; exit 1; fi
              DIR="$(cd "$(dirname "$S")" && pwd)"
            fi
          fi
          echo "Project dir: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Android SDK setup
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "${{ steps.find.outputs.dir }}/local.properties"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          {
            echo "## Build errors"
            echo '```'
            echo "--- Kotlin errors ---"
            grep -E "^e: " build.log | head -60 || true
            echo "--- Resource / AAPT / Manifest ---"
            grep -Ei "AAPT|Manifest merger|resource .* not found|error:" build.log | head -30 || true
            echo "--- What went wrong ---"
            grep -A8 "What went wrong" build.log | head -40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

