
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      
- name: Configure Android SDK
  run: |
    echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
    echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
    echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
    echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> $GITHUB_PATH

- name: Verify Android SDK
  run: |
    echo "SDK: $ANDROID_HOME"
    sdkmanager --version

- name: Install Android SDK packages
  run: |
    yes | sdkmanager --licenses || true
    sdkmanager --install \
      "platforms;android-34" \
      "build-tools;34.0.0" \
      "platform-tools"
      

      - name: Find project root
        id: find
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            DIR="$PWD"
          else
            S=$(find . -maxdepth 5 \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path './.git/*' | head -n 1)

            if [[ -z "$S" ]]; then
              echo "No Gradle project found"
              exit 1
            fi

            DIR="$(cd "$(dirname "$S")" && pwd)"
          fi

          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configure Android SDK
        env:
          PROJECT_DIR: ${{ steps.find.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError" \
            2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-5.5-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          
