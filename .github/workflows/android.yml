
- name: Find project root
  id: find
  shell: bash
  run: |
    set -euo pipefail

    echo "========== REPOSITORY FILES =========="
    ls -la

    echo "========== SEARCHING GRADLE PROJECT =========="

    S=$(find "$GITHUB_WORKSPACE" \
      -type f \
      \( -name settings.gradle.kts -o -name settings.gradle \) \
      -not -path '*/.git/*' \
      -not -path '*/.gradle/*' \
      | head -n 1)

    if [[ -z "$S" ]]; then
      echo "::error::No settings.gradle or settings.gradle.kts found"
      find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
      exit 1
    fi

    DIR="$(dirname "$S")"

    echo "Found Gradle project: $DIR"

    if [[ ! -d "$DIR/app" ]]; then
      echo "::error::Android app module not found in $DIR"
      exit 1
    fi

    echo "dir=$DIR" >> "$GITHUB_OUTPUT"
