name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find project root
        id: find
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            DIR="$PWD"
          else
            S=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -1)
            if [ -z "$S" ]; then
              echo "No Gradle project found"
              exit 1
            fi
            DIR="\( (cd " \)(dirname "$S")" && pwd)"
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        run: |
          echo "sdk.dir=\( ANDROID_HOME" > " \){{ steps.find.outputs.dir }}/local.properties"

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Generate Gradle Wrapper (if missing)
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then
            echo "No gradlew found — generating wrapper..."
            gradle wrapper --gradle-version 8.7 --no-daemon
            chmod +x gradlew
          else
            chmod +x gradlew
            echo "gradlew already present"
          fi

      - name: Unit tests (non-blocking)
        working-directory: ${{ steps.find.outputs.dir }}
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace || true

      - name: Build Debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError" \
            2>&1 | tee build.log

      - name: Show errors on failure
        if: failure()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "========== KOTLIN ERRORS =========="
          grep -E "^e: " build.log | head -50 || true
          echo ""
          echo "========== WHAT WENT WRONG =========="
          grep -A10 "What went wrong" build.log | head -40 || true
          echo ""
          echo "========== LAST 80 LINES =========="
          tail -80 build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-5.5-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: ignore
