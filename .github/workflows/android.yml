
name: SwarmDeck 5.5 - Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SwarmDeck APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Detect project root
      - name: Find project root
        id: find
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            DIR="$PWD"
          else
            S=$(find . -maxdepth 5 \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path './.git/*' | head -n 1)

            if [[ -z "$S" ]]; then
              echo "::error::No Gradle project found"
              exit 1
            fi

            DIR="$(cd "$(dirname "$S")" && pwd)"
          fi

          echo "Project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # 4. Detect preinstalled Android SDK
      - name: Detect Android SDK
        id: android
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "::error::Android SDK not found on runner"
            env | grep -E 'ANDROID|JAVA' || true
            exit 1
          fi

          echo "Android SDK: $SDK"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found in existing SDK"
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "SDK Manager found: $SDKMANAGER"

          ls -la "$SDK/platforms" || true
          ls -la "$SDK/build-tools" || true

      # 5. Accept licenses and install only required missing packages
      - name: Verify Android SDK packages
        shell: bash
        env:
          SDK: ${{ steps.android.outputs.sdk }}
          SDKMANAGER: ${{ steps.android.outputs.sdkmanager }}
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [[ ! -d "$SDK/platforms/android-34" ]]; then
            echo "Installing Android 34 platform..."
            "$SDKMANAGER" --install "platforms;android-34"
          fi

          if [[ ! -d "$SDK/build-tools/34.0.0" ]]; then
            echo "Installing Build Tools 34..."
            "$SDKMANAGER" --install "build-tools;34.0.0"
          fi

          echo "Android SDK packages ready"

      # 6. Write local.properties
      - name: Configure local.properties
        env:
          PROJECT_DIR: ${{ steps.find.outputs.dir }}
          SDK: ${{ steps.android.outputs.sdk }}
        run: |
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"
          cat "$PROJECT_DIR/local.properties"

      # 7. Setup Gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 8. Generate wrapper if missing
      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.find.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [[ ! -f gradlew ]]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

          chmod +x gradlew
          ./gradlew --version

      # 9. Run unit tests (non-blocking)
      - name: Run Unit Tests
        working-directory: ${{ steps.find.outputs.dir }}
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # 10. Build APK
      - name: Build Debug APK
        id: build
        working-directory: ${{ steps.find.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+HeapDumpOnOutOfMemoryError" \
            2>&1 | tee build.log

      # 11. Display build errors
      - name: Show Build Errors
        if: failure()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "========== KOTLIN ERRORS =========="
          grep -E "^e: " build.log | head -50 || true

          echo "========== GRADLE ERRORS =========="
          grep -A12 "What went wrong" build.log | head -50 || true

          echo "========== LAST 100 LINES =========="
          tail -100 build.log || true

      # 12. Upload APK
      - name: Upload SwarmDeck APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-5.5-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Upload failure log
      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SwarmDeck-5.5-Build-Log
          path: ${{ steps.find.outputs.dir }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          
